<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoldTrader — $summary</title>
<script>(function(){var t=localStorage.getItem('bt-theme');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
$drawer
$banner
<div class="meta">
  <div><strong>$summary</strong> · $count listings · $status</div>
  <div class="toggles">$toggles</div>
</div>
<ul class="results">
$rows
</ul>
<dialog id="desc-dialog">
  <form method="post" action="/describe">
    <input type="hidden" name="search_id" value="$search_id">
    <input type="hidden" name="listing_id" id="dlg-listing-id">
    <p class="note">Your description supplements the AI enrichment — it overrides the seller's text where they disagree. Leave empty to clear.</p>
    <textarea name="description" id="dlg-text" rows="5" placeholder="What this listing actually is, what's included, condition details..."></textarea>
    <div class="dlg-btns">
      <button type="button" id="dlg-cancel">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>
</dialog>
</body>
</html>
