<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoldTrader — $query</title>
<script>(function(){var t=localStorage.getItem('bt-theme');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<nav class="navbar">
  <a class="brand" href="/">BoldTrader</a>
  <div class="links">
    <a href="/searches">Bargain Searches</a>
    <a href="/chat">New Search</a>
    <a href="/raw">Raw Search</a>
  </div>
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</nav>
<form class="search searchbar" method="get" action="/raw">
  <input type="text" name="q" value="$query" placeholder="Search listings…">
  <input type="text" name="loc" value="$location" placeholder="Location (e.g. Kenmore, WA)">
  $market_select
  <button type="submit">Search</button>
</form>
$banner
<div class="meta">$total results for <strong>$query</strong> · page $page of $total_pages · $source</div>
<ul class="results">
$rows
</ul>
<nav class="pager">
$pagination
</nav>
</body>
</html>
