<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoldTrader — $heading</title>
<script>(function(){var t=localStorage.getItem('bt-theme');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="stylesheet" href="/app.css">
<script src="/purify.min.js" defer></script>
<script src="/marked.min.js" defer></script>
<script src="/chat.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<nav class="navbar">
  <a class="brand" href="/">BoldTrader</a>
  <div class="links">
    <a href="/searches">Bargain Searches</a>
    <a href="/chat">New Search</a>
    <a href="/raw">Raw Search</a>
  </div>
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</nav>
$banner
<div class="wrap">
$transcript
$confirm
<form class="say" method="post" action="/chat">
  <input type="hidden" name="transcript" value="$transcript_json">
  <input type="hidden" name="session_id" value="$session_id">
  <textarea name="message" rows="3" placeholder="What are you looking for?"></textarea>
  <button type="submit">Send</button>
</form>
<div id="overlay">
  <div class="spinner" role="status"><span class="visually-hidden">Working…</span></div>
</div>
</div>
</body>
</html>
